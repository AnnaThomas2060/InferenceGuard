schema_version: session10_production_evidence_v1
release_id: session10_production_v1

serving:
  compose_file: docker-compose.yml
  service: inference-guard-api

  risk_model_id_env: RISK_MODEL_ID
  risk_model_revision_env: RISK_MODEL_REVISION

  rewriter_model_id_env: REWRITER_MODEL_ID
  rewriter_model_revision_env: REWRITER_MODEL_REVISION

risk_model:
  served_model_id: AT707/InferenceGuard-Roberta-Risk

  evaluation_artifact: artifacts/risk_eval/inferenceguard-roberta-risk_val_2026-11-10.json

  require_revision_pin: true
  require_revision_match: true

  # The product exposes categorical risk bands, so calibration evidence
  # must explicitly mark every fitted attribute band as usable before
  # production evidence can pass.
  require_usable_fitted_bands: true

rewriter:
  served_model_id: AT707/inferenceguard-rewriter-v1
  expected_base_model_id: Qwen/Qwen2.5-1.5B-Instruct

  historical_readiness_artifact: experiments/session08_heldout_eval_v1/readiness.json
  require_readiness_base_model_match: true

  # No reportable evaluation artifact has yet been registered for
  # the hosted 1.54B production rewriter.
  require_evaluation_artifact: true
  evaluation_artifact: null

heldout:
  require_reportable_result: true

  # Phi-4 held-out production evaluation has not yet been run.
  result_artifact: null

output:
  evidence_file: artifacts/production/session10_evidence.json
