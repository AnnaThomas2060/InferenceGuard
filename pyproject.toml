[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-guard"
version = "0.7.0"
description = "Production privacy firewall neutralizing inferential leakage in LLMs"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "web*"]
